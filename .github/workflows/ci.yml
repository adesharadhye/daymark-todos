# Name the workflow shown in the GitHub Actions interface.
name: Checks

on:
  push:
  # Run checks for proposed pull-request changes.
  pull_request:

jobs:
  check:
    # Use a clean GitHub-hosted Ubuntu runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Install the required Node.js runtime and configure npm caching.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # Cache npm package downloads using the dependency lockfile.
          cache: npm
      - run: npm ci
      - run: npm run check
      # Install Chromium and its Linux system libraries for browser tests.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        # Upload diagnostic reports only when an earlier step failed.
        if: failure()
        with:
          name: playwright-report
          # Collect the generated Playwright HTML report.
          path: playwright-report/
          retention-days: 7
